<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vectorización Tétrica - CSS Puro</title>
    <style>
        /* Ambiente tétrico general */
        body {
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            /* Viñeta oscura en los bordes */
            box-shadow: inset 0 0 150px rgba(0,0,0,1);
        }

        /* Lienzo contenedor (Sin motor gráfico, solo DOM) */
        .lienzo {
            position: relative;
            width: 300px;
            height: 400px;
            /* Filtro global para darle un tono pálido y tétrico a todo el vector */
            filter: drop-shadow(0 0 10px rgba(139, 0, 0, 0.2)) contrast(1.2) grayscale(0.3);
        }

        /* =========================================
           FORMAS VECTORIALES (Construidas con DIVs)
           ========================================= */

        /* 1. Cabello de fondo */
        .cabello-fondo {
            position: absolute;
            width: 160px;
            height: 180px;
            background: #111;
            top: 20px;
            left: 70px;
            border-radius: 50% 50% 40% 40% / 60% 60% 30% 30%;
        }

        /* 2. Rostro base */
        .rostro {
            position: absolute;
            width: 120px;
            height: 150px;
            background: #cbbdb4; /* Piel pálida */
            top: 50px;
            left: 90px;
            border-radius: 40% 40% 50% 50% / 30% 30% 70% 70%; /* Forma de mandíbula */
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.3); /* Sombra para dar volumen */
        }

        /* 3. Mechones de cabello delanteros */
        .mechon-izq {
            position: absolute;
            width: 50px;
            height: 120px;
            background: #111;
            top: 30px;
            left: 70px;
            border-radius: 50% 0 50% 50%;
            transform: rotate(15deg);
            box-shadow: inset -5px 0 10px rgba(255,255,255,0.05);
        }
        .mechon-der {
            position: absolute;
            width: 50px;
            height: 130px;
            background: #111;
            top: 30px;
            right: 70px;
            border-radius: 0 50% 50% 50%;
            transform: rotate(-15deg);
            box-shadow: inset 5px 0 10px rgba(255,255,255,0.05);
        }

        /* 4. Cuello */
        .cuello {
            position: absolute;
            width: 40px;
            height: 40px;
            background: #b8a79d;
            top: 190px;
            left: 130px;
        }

        /* 5. Ojos hundidos (Ojeras) */
        .ojera-izq, .ojera-der {
            position: absolute;
            width: 40px;
            height: 30px;
            background: rgba(80, 50, 50, 0.4); /* Morado/Rojo oscuro */
            top: 100px;
            border-radius: 50%;
            filter: blur(3px);
        }
        .ojera-izq { left: 100px; transform: rotate(10deg); }
        .ojera-der { right: 100px; transform: rotate(-10deg); }

        /* 6. Globos oculares (Blancos) */
        .ojo-izq, .ojo-der {
            position: absolute;
            width: 30px;
            height: 20px;
            background: #e8e8e8;
            top: 105px;
            border-radius: 50%;
            overflow: hidden;
        }
        .ojo-izq { left: 105px; transform: rotate(5deg); }
        .ojo-der { right: 105px; transform: rotate(-5deg); }

        /* 7. Pupilas (Pequeñas, para mirada perdida) */
        .pupila {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #000;
            border-radius: 50%;
            top: 6px;
            left: 11px;
        }

        /* 8. Cejas caídas (Tristeza) */
        .ceja-izq, .ceja-der {
            position: absolute;
            width: 35px;
            height: 5px;
            background: #222;
            top: 85px;
            border-radius: 10px;
        }
        .ceja-izq { left: 100px; transform: rotate(15deg); }
        .ceja-der { right: 100px; transform: rotate(-15deg); }

        /* 9. Nariz (Vectorizada con un triángulo/curva sutil) */
        .nariz {
            position: absolute;
            width: 15px;
            height: 30px;
            border-right: 2px solid rgba(0,0,0,0.2);
            border-bottom: 2px solid rgba(0,0,0,0.1);
            top: 120px;
            left: 142px;
            border-radius: 0 0 10px 0;
        }

        /* 10. Boca (Línea recta caída) */
        .boca {
            position: absolute;
            width: 25px;
            height: 4px;
            background: #5a3a3a;
            top: 170px;
            left: 138px;
            border-radius: 2px;
            border-bottom: 2px solid rgba(0,0,0,0.4); /* Sombra del labio inferior */
        }

        /* 11. Cuello y Hombros (Insinuación) */
        .hombros {
            position: absolute;
            width: 200px;
            height: 100px;
            background: #1a1a1a; /* Ropa oscura */
            top: 220px;
            left: 50px;
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
        }

        /* 12. Collar */
        .collar-hilo {
            position: absolute;
            width: 60px;
            height: 30px;
            border-bottom: 2px solid #555;
            border-radius: 50%;
            top: 210px;
            left: 120px;
            z-index: 2;
        }
        .collar-dije {
            position: absolute;
            width: 8px;
            height: 12px;
            background: #8b0000; /* Gema roja apagada */
            top: 235px;
            left: 146px;
            border-radius: 2px 2px 50% 50%;
            z-index: 3;
            box-shadow: 0 0 5px #8b0000;
        }

        /* Efecto de parpadeo tenue en los ojos (Animación CSS) */
        .parpadeo {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #cbbdb4;
            top: 0;
            left: 0;
            animation: cerrarOjos 5s infinite;
            transform: translateY(-100%);
        }

        @keyframes cerrarOjos {
            0%, 95%, 100% { transform: translateY(-100%); }
            97% { transform: translateY(0); }
        }

    </style>
</head>
<body>

    <!-- Contenedor principal -->
    <div class="lienzo">
        <div class="cabello-fondo"></div>
        <div class="rostro"></div>
        
        <div class="ojera-izq"></div>
        <div class="ojera-der"></div>
        
        <div class="ojo-izq">
            <div class="pupila"></div>
            <div class="parpadeo"></div> <!-- Animación de párpado -->
        </div>
        <div class="ojo-der">
            <div class="pupila"></div>
            <div class="parpadeo"></div> <!-- Animación de párpado -->
        </div>
        
        <div class="ceja-izq"></div>
        <div class="ceja-der"></div>
        
        <div class="nariz"></div>
        <div class="boca"></div>
        
        <div class="mechon-izq"></div>
        <div class="mechon-der"></div>
        
        <div class="cuello"></div>
        <div class="hombros"></div>
        
        <div class="collar-hilo"></div>
        <div class="collar-dije"></div>
    </div>

</body>
</html>
