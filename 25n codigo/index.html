<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Madre en Duelo</title>
<style>
:root { color-scheme: dark; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html, body { height: 100%; margin: 0; background: #000; }
body { display: flex; justify-content: center; align-items: center; overflow: hidden; }
svg { height: min(96vh, 1000px); max-width: 100vw; aspect-ratio: 516 / 692; display: block; }
svg * { transform-box: view-box; }

/* respiración y balanceo de todo el cuerpo */
#fig { transform-origin: 258px 680px; animation: respirar 5.5s ease-in-out infinite alternate, vaiven 9s ease-in-out infinite alternate; }
@keyframes respirar { from { transform: translateY(0) scale(1, 1); } to { transform: translateY(-2.5px) scale(1.002, 1.006); } }
@keyframes vaiven { from { rotate: -.35deg; } to { rotate: .35deg; } }

/* el rizo se mece */
#rizo { transform-origin: 312px 38px; animation: mecer 3.2s ease-in-out infinite alternate; }
@keyframes mecer { from { rotate: -3deg; } to { rotate: 3.5deg; } }

/* pestañeo: ojos abiertos se ocultan y aparecen los cerrados */
#abiertos { animation: abrir 5.2s infinite; }
#cerrados { animation: cerrar 5.2s infinite; opacity: 0; }
@keyframes abrir  { 0%, 93%, 97.5%, 100% { opacity: 1; } 94%, 97% { opacity: 0; } }
@keyframes cerrar { 0%, 93%, 97.5%, 100% { opacity: 0; } 94%, 97% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { #fig, #rizo, #abiertos, #cerrados { animation: none; } #cerrados { opacity: 0; } }
</style>
</head>

        <animate attributeName="seed" values="1;2;3;4;5;6" dur="1.2s" calcMode="discrete" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
